name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install Gradle & seed Gradle wrapper cache (avoid wrapper download)
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.14.0

          echo "Installing Gradle CLI ${GRADLE_VERSION} to runner temp..."
          curl -sSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle-${GRADLE_VERSION}-bin.zip
          mkdir -p $RUNNER_TEMP/gradle
          unzip -q gradle-${GRADLE_VERSION}-bin.zip -d $RUNNER_TEMP/gradle
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}" >> $GITHUB_ENV

          echo "Seeding Gradle wrapper cache so wrapper does not need to download distribution..."
          # Create the folder the wrapper checks under ~/.gradle/wrapper/dists/<dist-name>/
          WRAPPER_DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-${GRADLE_VERSION}-all"
          mkdir -p "$WRAPPER_DIST_DIR/gradle-${GRADLE_VERSION}"
          # Download the all zip and unzip into the seeded folder
          curl -sSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-all.zip" -o gradle-${GRADLE_VERSION}-all.zip
          unzip -q gradle-${GRADLE_VERSION}-all.zip -d "$WRAPPER_DIST_DIR/gradle-${GRADLE_VERSION}"

      - name: Install Android command-line tools and required SDKs
        run: |
          set -euo pipefail
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;27.0.12077973"
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses

      - name: Export Android SDK envs
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: (Optional) Decode keystore from secret and create key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 --decode > android/key.jks
          cat > android/key.properties <<EOF
          storePassword=${{ env.KEYSTORE_PASSWORD }}
          keyPassword=${{ env.KEY_PASSWORD }}
          keyAlias=${{ env.KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
