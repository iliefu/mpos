name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install Gradle & seed Gradle wrapper cache (robust)
        run: |
          set -euo pipefail

          GRADLE_VERSION=8.14.0
          TARGET_DIR="$RUNNER_TEMP/gradle"
          BIN_ZIP="gradle-${GRADLE_VERSION}-bin.zip"
          ALL_ZIP="gradle-${GRADLE_VERSION}-all.zip"

          download_with_retries() {
            local url=$1
            local out=$2
            local tries=3
            local wait=2
            for i in $(seq 1 $tries); do
              echo "Attempt $i downloading $url ..."
              if curl -fSL "$url" -o "$out"; then
                # quick sanity size check
                if [ "$(stat -c%s "$out")" -gt 10000 ]; then
                  # validate zip
                  if unzip -tq "$out" >/dev/null 2>&1; then
                    echo "Downloaded and validated $out"
                    return 0
                  else
                    echo "Downloaded file is not a valid zip: $out"
                  fi
                else
                  echo "Downloaded file is too small: $(stat -c%s "$out") bytes"
                fi
              else
                echo "curl failed for $url"
              fi
              rm -f "$out"
              sleep $((wait * i))
            done
            return 1
          }

          mkdir -p "$TARGET_DIR"
          cd "$RUNNER_TEMP"

          # Try bin.zip first (smaller). If successful, still attempt to fetch all.zip for seeding wrapper cache.
          if download_with_retries "https://services.gradle.org/distributions/${BIN_ZIP}" "${BIN_ZIP}"; then
            unzip -q "${BIN_ZIP}" -d "$TARGET_DIR"
            echo "$TARGET_DIR/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
            echo "GRADLE_HOME=$TARGET_DIR/gradle-${GRADLE_VERSION}" >> $GITHUB_ENV

            # Try to get the all.zip to seed wrapper cache (preferred). If this fails, we will still have gradle CLI.
            if download_with_retries "https://services.gradle.org/distributions/${ALL_ZIP}" "${ALL_ZIP}"; then
              WRAPPER_DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-${GRADLE_VERSION}-all"
              mkdir -p "$WRAPPER_DIST_DIR/gradle-${GRADLE_VERSION}"
              unzip -q "${ALL_ZIP}" -d "$WRAPPER_DIST_DIR/gradle-${GRADLE_VERSION}"
              echo "Seeded Gradle wrapper cache with all.zip"
            else
              echo "Warning: couldn't download ${ALL_ZIP}; wrapper cache not seeded, but system Gradle is installed."
            fi
          else
            # bin.zip failed — try the all.zip directly
            if download_with_retries "https://services.gradle.org/distributions/${ALL_ZIP}" "${ALL_ZIP}"; then
              unzip -q "${ALL_ZIP}" -d "$TARGET_DIR"
              echo "$TARGET_DIR/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
              echo "GRADLE_HOME=$TARGET_DIR/gradle-${GRADLE_VERSION}" >> $GITHUB_ENV

              WRAPPER_DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-${GRADLE_VERSION}-all"
              mkdir -p "$WRAPPER_DIST_DIR/gradle-${GRADLE_VERSION}"
              unzip -q "${ALL_ZIP}" -d "$WRAPPER_DIST_DIR/gradle-${GRADLE_VERSION}"
              echo "Downloaded all.zip and seeded wrapper cache"
            else
              echo "ERROR: Failed to download Gradle ${GRADLE_VERSION} (both bin and all zips)."
              exit 2
            fi
          fi

      - name: Install Android command-line tools and required SDKs
        run: |
          set -euo pipefail
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;27.0.12077973"
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses

      - name: Export Android SDK envs
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: (Optional) Decode keystore from secret and create key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 --decode > android/key.jks
          cat > android/key.properties <<EOF
          storePassword=${{ env.KEYSTORE_PASSWORD }}
          keyPassword=${{ env.KEY_PASSWORD }}
          keyAlias=${{ env.KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk
