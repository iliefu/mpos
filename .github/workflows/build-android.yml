name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install Gradle (multiple-version fallback) and seed Gradle wrapper cache (correctly)
        run: |
          set -euo pipefail

          # Candidate Gradle versions to try (preferred -> fallback)
          CANDIDATES=("8.14.0" "8.13.1" "8.13.0" "8.12.1" "8.10.2")
          TARGET_DIR="$RUNNER_TEMP/gradle"
          mkdir -p "$TARGET_DIR"
          cd "$RUNNER_TEMP"

          download_with_retries() {
            local url=$1 out=$2 tries=3 wait=2
            for i in $(seq 1 $tries); do
              echo "Attempt $i downloading $url ..."
              if curl -fSL "$url" -o "$out"; then
                if [ "$(stat -c%s "$out")" -gt 10000 ]; then
                  if unzip -tq "$out" >/dev/null 2>&1; then
                    echo "Downloaded and validated $out"
                    return 0
                  else
                    echo "Downloaded file is not a valid zip: $out"
                  fi
                else
                  echo "Downloaded file is too small: $(stat -c%s "$out") bytes"
                fi
              else
                echo "curl failed for $url"
              fi
              rm -f "$out"
              sleep $((wait * i))
            done
            return 1
          }

          SELECTED=""
          for v in "${CANDIDATES[@]}"; do
            echo "Trying Gradle ${v} ..."
            BIN_ZIP="gradle-${v}-bin.zip"
            ALL_ZIP="gradle-${v}-all.zip"

            # 1) Try bin zip (smaller) to install CLI gradle
            if download_with_retries "https://services.gradle.org/distributions/${BIN_ZIP}" "${BIN_ZIP}"; then
              unzip -q "${BIN_ZIP}" -d "$TARGET_DIR"
              echo "$TARGET_DIR/gradle-${v}/bin" >> $GITHUB_PATH
              echo "GRADLE_HOME=$TARGET_DIR/gradle-${v}" >> $GITHUB_ENV
              SELECTED="$v"

              # 2) Try to seed wrapper cache using ALL zip. Place extracted files into a hash subdir so wrapper finds it.
              if download_with_retries "https://services.gradle.org/distributions/${ALL_ZIP}" "${ALL_ZIP}"; then
                WRAPPER_BASE="$HOME/.gradle/wrapper/dists/gradle-${v}-all"
                mkdir -p "$WRAPPER_BASE"
                # create a unique/hash-like subdir name (wrapper expects a subdir)
                SUBDIR="$(date +%s)-$RANDOM"
                mkdir -p "$WRAPPER_BASE/$SUBDIR"
                unzip -q "${ALL_ZIP}" -d "$WRAPPER_BASE/$SUBDIR"
                echo "Seeded wrapper cache for gradle-${v} in $WRAPPER_BASE/$SUBDIR"
              else
                echo "Could not download ${ALL_ZIP} to seed wrapper cache, but CLI gradle installed."
              fi

              break
            fi

            # 3) Try all.zip directly (slower but complete). Seed wrapper cache with an extra subdir.
            if download_with_retries "https://services.gradle.org/distributions/${ALL_ZIP}" "${ALL_ZIP}"; then
              unzip -q "${ALL_ZIP}" -d "$TARGET_DIR"
              echo "$TARGET_DIR/gradle-${v}/bin" >> $GITHUB_PATH
              echo "GRADLE_HOME=$TARGET_DIR/gradle-${v}" >> $GITHUB_ENV

              WRAPPER_BASE="$HOME/.gradle/wrapper/dists/gradle-${v}-all"
              mkdir -p "$WRAPPER_BASE"
              SUBDIR="$(date +%s)-$RANDOM"
              mkdir -p "$WRAPPER_BASE/$SUBDIR"
              unzip -q "${ALL_ZIP}" -d "$WRAPPER_BASE/$SUBDIR"
              echo "Installed and seeded wrapper cache for gradle-${v} in $WRAPPER_BASE/$SUBDIR"

              SELECTED="$v"
              break
            fi

            echo "Gradle ${v} not available, trying next candidate..."
          done

          if [ -z "$SELECTED" ]; then
            echo "WARNING: Could not download any candidate Gradle versions; will fall back to skip-validation mode."
            echo "USE_SKIP=true" >> $GITHUB_ENV
          else
            echo "Using Gradle ${SELECTED} installed on runner."
            echo "USE_SKIP=false" >> $GITHUB_ENV
          fi

      - name: Install Android command-line tools and required SDKs (licenses handled safely)
        run: |
          # Normal strict mode
          set -euo pipefail

          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          # Temporarily disable pipefail so piping 'yes' to sdkmanager does not cause a broken-pipe failure
          set +o pipefail
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;27.0.12077973"
          SDK_INSTALL_EXIT=$?
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
          SDK_LICENSES_EXIT=$?
          set -o pipefail
          if [ $SDK_INSTALL_EXIT -ne 0 ]; then
            echo "sdkmanager install failed with exit $SDK_INSTALL_EXIT" >&2
            exit $SDK_INSTALL_EXIT
          fi
          if [ $SDK_LICENSES_EXIT -ne 0 ]; then
            echo "sdkmanager --licenses failed with exit $SDK_LICENSES_EXIT" >&2
            exit $SDK_LICENSES_EXIT
          fi

      - name: Export Android SDK envs
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: (Optional) Decode keystore from secret and create key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 --decode > android/key.jks
          cat > android/key.properties <<EOF
          storePassword=${{ env.KEYSTORE_PASSWORD }}
          keyPassword=${{ env.KEY_PASSWORD }}
          keyAlias=${{ env.KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK (release)
        run: |
          set -euo pipefail
          if [ "${USE_SKIP:-false}" = "true" ]; then
            echo "Gradle not preinstalled. Building with --android-skip-build-dependency-validation"
            flutter build apk --release --android-skip-build-dependency-validation
          else
            echo "Building normally (Gradle preinstalled or wrapper seeded)."
            flutter build apk --release
          fi

      - name: Upload APK artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk
